       🎨 스타일 (CSS)

    * {

    }

    body {
      font-family: 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

    .container {

    h1 {

      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);

    .section {

      margin-bottom: 15px;

    }

    /* 입력창 */
    textarea, input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      font-family: 'Malgun Gothic', sans-serif;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    /* 버튼 */
    button {

      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 결과 박스 */
    .result-item {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 2px solid #e0e0e0;
    }

      margin-bottom: 10px;
    }

    .result-body {
      line-height: 1.8;
      white-space: pre-wrap;
    }

      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 10px 0;
    }

    /* 로딩 표시 */

      text-align: center;
      color: #667eea;
      font-weight: bold;
      padding: 20px;
    }
